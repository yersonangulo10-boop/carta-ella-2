<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:#05061a;
    --night:#0c0f2e;
    --indigo:#1b2050;
    --gold:#f2cd7e;
    --gold-soft:#c9a86b;
    --lavender:#b9aeea;
    --cream:#f3efe6;
    --muted:#8a8ec2;
    --font-display:'Cormorant Garamond', serif;
    --font-body:'Jost', sans-serif;
    --font-script:'Parisienne', cursive;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:
      radial-gradient(ellipse at 50% 0%, var(--indigo) 0%, var(--night) 45%, var(--night-deep) 100%);
    color:var(--cream);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Cielo de estrellas ambientales ---------- */
  #sky{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;}
  .star{
    position:absolute;
    width:2px;height:2px;
    background:var(--cream);
    border-radius:50%;
    opacity:0;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0;transform:scale(1);}
    50%{opacity:.9;transform:scale(1.6);}
  }

  /* ---------- Pantalla 1: entrada ---------- */
  #entrance{
    position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:34px;text-align:center;padding:32px;
    transition:opacity .8s ease, filter .8s ease, transform .8s ease;
  }
  #entrance.hidden{opacity:0;filter:blur(6px);transform:scale(1.08);pointer-events:none;}

  #entrance h1{
    font-family:var(--font-display);font-style:italic;font-weight:500;
    font-size:clamp(28px,6.5vw,46px);max-width:480px;line-height:1.32;
    opacity:0;animation:fadeUp 1.1s ease forwards .3s;
  }
  #entrance .sub{
    font-weight:300;letter-spacing:.05em;color:var(--muted);font-size:14px;max-width:300px;
    opacity:0;animation:fadeUp 1.1s ease forwards .65s;
  }

  /* Estrella-botón que respira suavemente hasta que se toca */
  .wish-wrap{
    position:relative;width:130px;height:130px;
    opacity:0;animation:fadeUp 1.1s ease forwards 1s;
  }
  .wish-btn{
    position:absolute;inset:0;
    border-radius:50%;border:none;background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .wish-btn svg{width:34px;height:34px;position:relative;z-index:2;}
  .wish-btn svg path{fill:var(--gold);}
  .wish-glow{
    position:absolute;inset:14px;border-radius:50%;
    background:radial-gradient(circle, rgba(242,205,126,.55), rgba(242,205,126,0) 70%);
    animation:breathe 2.6s ease-in-out infinite;
  }
  .wish-ring{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid rgba(242,205,126,.35);
    animation:ringPulse 2.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(.85);opacity:.55;}
    50%{transform:scale(1.15);opacity:.95;}
  }
  @keyframes ringPulse{
    0%{transform:scale(.9);opacity:.5;}
    70%{transform:scale(1.35);opacity:0;}
    100%{transform:scale(1.35);opacity:0;}
  }
  .wish-btn:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:50%;}

  .wish-wrap.launched .wish-glow,
  .wish-wrap.launched .wish-ring{animation:none;opacity:0;transition:opacity .4s ease;}
  .wish-wrap.launched .wish-btn svg{transition:transform .4s ease, opacity .4s ease;transform:scale(.2);opacity:0;}

  /* Estrella fugaz que cruza la pantalla al tocar */
  .shooting-star{
    position:fixed;z-index:11;top:50%;left:50%;
    width:3px;height:3px;border-radius:50%;background:var(--cream);
    box-shadow:0 0 8px 2px rgba(255,255,255,.8);
    opacity:0;pointer-events:none;
  }
  .shooting-star::after{
    content:"";position:absolute;top:50%;right:100%;width:140px;height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.75));
    transform:translateY(-50%);
  }
  .shooting-star.fire{
    animation:shoot 1s cubic-bezier(.3,.6,.4,1) forwards;
  }
  @keyframes shoot{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(-34deg) translateX(0);}
    12%{opacity:1;}
    85%{opacity:.9;}
    100%{opacity:0;transform:translate(-50%,-50%) rotate(-34deg) translateX(920px);}
  }

  /* ---------- Pantalla 2: la carta ---------- */
  #letter-screen{
    position:fixed;inset:0;z-index:5;overflow-y:auto;
    padding:min(9vh,80px) 26px 90px;
    opacity:0;pointer-events:none;
    transition:opacity 1s ease;
  }
  #letter-screen.visible{opacity:1;pointer-events:auto;}

  .letter-inner{max-width:560px;margin:0 auto;position:relative;}

  /* Constelación que se dibuja sobre el título */
  .constellation{
    display:block;margin:0 auto 6px;width:150px;height:54px;overflow:visible;
  }
  .constellation path{
    fill:none;stroke:var(--gold-soft);stroke-width:1;
    stroke-dasharray:1; stroke-dashoffset:1; pathLength:1;
    transition:stroke-dashoffset 1.6s ease;
  }
  .constellation.shown path{stroke-dashoffset:0;}
  .constellation circle{
    fill:var(--gold);opacity:0;transform-origin:center;
    transition:opacity .5s ease, transform .5s ease;transform:scale(0);
  }
  .constellation.shown circle{opacity:1;transform:scale(1);}
  .constellation.shown circle:nth-of-type(1){transition-delay:.15s;}
  .constellation.shown circle:nth-of-type(2){transition-delay:.55s;}
  .constellation.shown circle:nth-of-type(3){transition-delay:.95s;}
  .constellation.shown circle:nth-of-type(4){transition-delay:1.35s;}

  .eyebrow{
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
    text-align:center;margin-bottom:14px;
    opacity:0;transition:opacity .8s ease;
  }
  .eyebrow.shown{opacity:1;}

  .letter-title{
    font-family:var(--font-display);font-style:italic;font-weight:500;
    font-size:clamp(28px,6vw,40px);text-align:center;margin-bottom:6px;
    opacity:0;transition:opacity .9s ease, transform .9s ease;transform:translateY(10px);
  }
  .letter-title.shown{opacity:1;transform:translateY(0);}

  .letter-date{
    text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-bottom:50px;
    opacity:0;transition:opacity .9s ease;
  }
  .letter-date.shown{opacity:1;}

  .letter-body p{
    position:relative;
    font-family:var(--font-display);font-size:clamp(18px,4vw,21px);font-weight:400;
    line-height:1.9;color:var(--cream);margin-bottom:24px;
    opacity:0;transform:translateY(14px);
    transition:opacity 1s ease, transform 1s ease;
  }
  .letter-body p.shown{opacity:1;transform:translateY(0);}
  /* breve destello dorado que recorre la primera línea al aparecer */
  .letter-body p::before{
    content:"";position:absolute;left:0;top:0;height:100%;width:0;
    background:linear-gradient(90deg, rgba(242,205,126,.16), transparent);
    pointer-events:none;
  }
  .letter-body p.shown::before{
    animation:sweep 1.4s ease forwards;
  }
  @keyframes sweep{
    from{width:0;opacity:1;}
    to{width:100%;opacity:0;}
  }

  .divider{
    width:0;height:1px;background:linear-gradient(90deg, transparent, var(--gold-soft), transparent);
    margin:38px auto;opacity:0;
    transition:opacity 1s ease, width 1.1s ease;
  }
  .divider.shown{opacity:.8;width:120px;}

  .signature-label{
    text-align:center;font-size:13px;font-weight:300;color:var(--muted);
    opacity:0;transition:opacity 1s ease;
  }
  .signature-label.shown{opacity:1;}

  .signature{
    text-align:center;font-family:var(--font-script);font-size:clamp(34px,8vw,46px);
    color:var(--gold);margin-top:8px;
    text-shadow:0 0 24px rgba(242,205,126,.35);
    opacity:0;transform:scale(.85);
    transition:opacity 1.1s ease, transform 1.1s ease;
  }
  .signature.shown{opacity:1;transform:scale(1);}

  .replay{
    display:block;margin:58px auto 0;background:none;border:none;
    color:var(--muted);font-size:12px;letter-spacing:.08em;
    text-decoration:underline;text-underline-offset:4px;text-decoration-color:transparent;
    cursor:pointer;transition:all .3s ease;opacity:0;
  }
  .replay.shown{opacity:1;}
  .replay:hover{color:var(--gold);text-decoration-color:var(--gold);}
  .replay:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div id="sky"></div>

<!-- ============ PANTALLA 1: ENTRADA ============ -->
<div id="entrance">
  <h1 id="entranceTitle">Cierra los ojos y pide un deseo</h1>
  <p class="sub" id="entranceSub">Luego, toca la estrella.</p>
  <div class="wish-wrap" id="wishWrap">
    <div class="wish-ring"></div>
    <div class="wish-glow"></div>
    <button class="wish-btn" id="enterBtn" aria-label="Pedir un deseo">
      <svg viewBox="0 0 24 24"><path d="M12 0l2.6 8.1H23l-6.9 5 2.6 8.1L12 16.2 5.3 21.2l2.6-8.1L1 8.1h8.4z"/></svg>
    </button>
  </div>
</div>

<!-- ============ PANTALLA 2: LA CARTA ============ -->
<div id="letter-screen">
  <div class="letter-inner">
    <svg class="constellation" id="constellation" viewBox="0 0 150 54">
      <path d="M8,40 L45,10 L75,34 L142,6" pathLength="1"/>
      <circle cx="8" cy="40" r="2.4"/>
      <circle cx="45" cy="10" r="2.4"/>
      <circle cx="75" cy="34" r="2.4"/>
      <circle cx="142" cy="6" r="2.4"/>
    </svg>
    <p class="eyebrow" id="eyebrow">un deseo cumplido</p>
    <h2 class="letter-title" id="letterTitle"></h2>
    <p class="letter-date" id="letterDate"></p>
    <div class="letter-body" id="letterBody"></div>
    <div class="divider" id="divider"></div>
    <p class="signature-label" id="signatureLabel">Con cariño</p>
    <p class="signature" id="signature"></p>
    <button class="replay" id="replayBtn">Pedir otro deseo</button>
  </div>
</div>

<script>
/* =========================================================================
   ✏️  EDITA AQUÍ: cambia estos textos por los tuyos. No necesitas tocar
   nada más del archivo, el resto se genera y anima solo.
   ========================================================================= */
const CONFIG = {
  titulo: "Para ti",
  firma: "Tu nombre",
  fecha: "28 de agosto de 2026",
  carta: [
    "Quiero contarte algo que llevo pensando hace un tiempo: [empieza aquí el motivo de esta carta — un recuerdo, una fecha, o simplemente ganas de decirte algo bonito].",
    "[Sigue con el cuerpo del mensaje. Puedes hablar de un momento que compartieron, algo que admiras de la otra persona, o cómo te hace sentir.]",
    "[Añade otro párrafo si quieres — cada uno aparecerá por separado, con un pequeño destello dorado, como si la estuvieras leyendo despacio.]",
    "[Cierra con una promesa, un deseo, o simplemente con lo que más quieras que recuerde de esta carta.]"
  ]
};

/* ---------------- Cielo de estrellas ---------------- */
function initSky(count){
  const container = document.getElementById('sky');
  const frag = document.createDocumentFragment();
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random()*2;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*100)+'%';
    s.style.animationDuration = (2.5 + Math.random()*4)+'s';
    s.style.animationDelay = (Math.random()*6)+'s';
    frag.appendChild(s);
  }
  container.appendChild(frag);
}
initSky(70);

/* ---------------- Transición entrada -> carta ---------------- */
const entrance = document.getElementById('entrance');
const letterScreen = document.getElementById('letter-screen');
const enterBtn = document.getElementById('enterBtn');
const wishWrap = document.getElementById('wishWrap');

enterBtn.addEventListener('click', () => {
  wishWrap.classList.add('launched');
  enterBtn.disabled = true;

  // lanzar estrella fugaz desde la posición del botón
  const rect = enterBtn.getBoundingClientRect();
  const star = document.createElement('div');
  star.className = 'shooting-star';
  star.style.top = (rect.top + rect.height/2) + 'px';
  star.style.left = (rect.left + rect.width/2) + 'px';
  document.body.appendChild(star);
  requestAnimationFrame(() => star.classList.add('fire'));
  setTimeout(() => star.remove(), 1100);

  setTimeout(() => {
    entrance.classList.add('hidden');
    letterScreen.classList.add('visible');
    revealLetter();
  }, 550);
});

/* ---------------- Construcción y revelado de la carta ---------------- */
const letterBody = document.getElementById('letterBody');
CONFIG.carta.forEach(line => {
  const p = document.createElement('p');
  p.textContent = line;
  letterBody.appendChild(p);
});
document.getElementById('letterTitle').textContent = CONFIG.titulo;
document.getElementById('letterDate').textContent = CONFIG.fecha;
document.getElementById('signature').textContent = CONFIG.firma;

let letterRevealed = false;

function revealLetter(){
  if(letterRevealed) return;
  letterRevealed = true;

  setTimeout(() => document.getElementById('constellation').classList.add('shown'), 150);
  setTimeout(() => document.getElementById('eyebrow').classList.add('shown'), 1500);
  setTimeout(() => document.getElementById('letterTitle').classList.add('shown'), 1800);
  setTimeout(() => document.getElementById('letterDate').classList.add('shown'), 2100);

  const paragraphs = Array.from(letterBody.children);
  paragraphs.forEach((p, i) => {
    setTimeout(() => p.classList.add('shown'), 2500 + i * 900);
  });

  const afterAll = 2500 + paragraphs.length * 900;
  setTimeout(() => document.getElementById('divider').classList.add('shown'), afterAll + 200);
  setTimeout(() => document.getElementById('signatureLabel').classList.add('shown'), afterAll + 650);
  setTimeout(() => document.getElementById('signature').classList.add('shown'), afterAll + 1050);
  setTimeout(() => document.getElementById('replayBtn').classList.add('shown'), afterAll + 1500);
}

document.getElementById('replayBtn').addEventListener('click', () => {
  letterRevealed = false;
  ['constellation','eyebrow','letterTitle','letterDate','divider','signatureLabel','signature','replayBtn']
    .forEach(id => document.getElementById(id).classList.remove('shown'));
  Array.from(letterBody.children).forEach(p => p.classList.remove('shown'));
  letterScreen.scrollTo({top:0, behavior:'smooth'});
  revealLetter();
});
</script>
</body>
</html>
